<title>ThermalGuard Demo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');
  :root{--bg:#0b0f14;--surface:#131920;--surface2:#1a222c;--border:#232e3b;--text:#e4e8ed;--dim:#7a8a9e;--accent:#00d4aa;--ag:rgba(0,212,170,.15);--alert:#ff4d6a;--alg:rgba(255,77,106,.15);--s1:#00d4aa;--s2:#4da6ff;--s3:#a07cff;--amb:#ffa842}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .mono{font-family:'IBM Plex Mono',monospace}

  header{padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface)}
  .logo{display:flex;align-items:center;gap:12px}
  .logo img{width:38px;height:38px;object-fit:contain}
  .logo-text{font-weight:600;font-size:17px;letter-spacing:-.3px}
  .logo-text span{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
  .hr{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  .badge{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:5px;white-space:nowrap}
  .b-ok{background:var(--ag);color:var(--accent)}.b-al{background:var(--alg);color:var(--alert);animation:fl 1s infinite}
  @keyframes fl{0%,100%{opacity:1}50%{opacity:.6}}

  .bc{padding:14px 28px;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:8px;max-width:956px;margin:0 auto}
  .bc a{color:var(--accent);text-decoration:none;cursor:pointer}.bc a:hover{text-decoration:underline}

  .flist{padding:0 28px 40px;max-width:900px;margin:0 auto}
  .unit-row{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;gap:24px}
  .unit-row:hover{background:var(--surface);border-radius:8px}
  .unit-info{min-width:160px}
  .un{font-weight:600;font-size:15px}
  .ul{font-size:11px;color:var(--dim);margin-top:2px}
  .unit-deltas{display:flex;align-items:center;gap:20px;flex:1;justify-content:center}
  .delta-group{text-align:center}
  .dg-label{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin-bottom:3px}
  .dg-val{font-size:20px;font-weight:700}
  .sensor-pills{display:flex;gap:10px;align-items:center}
  .pill{font-size:11px;padding:4px 8px;background:var(--surface2);border-radius:5px}

  /* Back button */
  .back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--accent);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit}
  .back-btn:hover{background:var(--surface2);border-color:var(--accent)}
  .back-btn svg{width:16px;height:16px}

  .dv{padding:0 28px 40px;display:none;max-width:956px;margin:0 auto}.dv.act{display:block}.fs.hid{display:none}
  .detail-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .detail-left{}
  .dt{font-size:22px;font-weight:700;margin-bottom:4px}
  .ds{font-size:12px;color:var(--dim)}

  .summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
  .sc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
  .sl{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin-bottom:4px}
  .sv{font-size:24px;font-weight:700}

  .cb{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:24px}
  .cb h3{font-size:13px;font-weight:600;margin-bottom:14px}
  .cw{position:relative;height:300px}

  .sensor-detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  @media(max-width:800px){.sensor-detail-grid{grid-template-columns:repeat(2,1fr)}}
  .sd-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;text-align:center;position:relative;overflow:hidden}
  .sd-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
  .sd-card.c1::before{background:var(--s1)}.sd-card.c2::before{background:var(--s2)}.sd-card.c3::before{background:var(--s3)}.sd-card.ca::before{background:var(--amb)}
  .sd-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
  .sd-temp{font-size:32px;font-weight:700;letter-spacing:-1px;margin-bottom:6px}
  .sd-delta{font-size:12px;padding:3px 10px;border-radius:4px;display:inline-block}
  .sd-delta.ok{background:var(--ag);color:var(--accent)}
  .sd-delta.al{background:var(--alg);color:var(--alert)}
  .sd-delta.ref{background:var(--surface2);color:var(--dim)}

  .unit-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
  .nav-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
  .nav-btn:hover{background:var(--surface2);border-color:var(--accent);color:var(--accent)}
  .nav-btn svg{width:14px;height:14px}
  .nav-label{font-size:11px;color:var(--dim)}

  /* ── Mobile ── */
  @media(max-width:640px){
    header{padding:12px 16px}
    .logo img{width:30px;height:30px}
    .logo-text{font-size:15px}
    .logo-text span{display:none}
    .bc{padding:12px 16px;font-size:12px}
    .flist{padding:0 16px 32px}
    .unit-row{flex-wrap:wrap;gap:12px;padding:14px 12px}
    .unit-info{min-width:auto;width:100%;display:flex;justify-content:space-between;align-items:center}
    .unit-deltas{justify-content:flex-start;gap:16px}
    .dg-val{font-size:17px}
    .sensor-pills{gap:6px}
    .pill{font-size:10px;padding:3px 6px}
    .dv{padding:0 16px 32px}
    .detail-top{flex-direction:column;align-items:flex-start;gap:12px}
    .back-btn{align-self:flex-start}
    .dt{font-size:18px}
    .summary-row{grid-template-columns:repeat(3,1fr);gap:10px}
    .sv{font-size:20px}
    .sc{padding:12px}
    .cw{height:220px}
    .cb{padding:14px}
    .sensor-detail-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .sd-temp{font-size:24px}
    .sd-card{padding:14px}
    .unit-nav{flex-direction:row;gap:10px}
    .nav-btn{font-size:12px;padding:6px 10px}
    footer{font-size:9px;letter-spacing:1px;padding:14px 16px}
  }
  @media(max-width:380px){
    .sensor-detail-grid{grid-template-columns:1fr}
    .summary-row{grid-template-columns:1fr}
    .unit-deltas{flex-direction:column;align-items:flex-start;gap:8px}
  }

  footer{padding:18px 28px;text-align:center;font-size:11px;color:var(--dim);border-top:1px solid var(--border);letter-spacing:1.5px;text-transform:uppercase;font-weight:500}
</style>
</head>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf//Z" alt="ThermalGuard">
    <div class="logo-text">ThermalGuard<span>Demo</span></div>
  </div>
  <div class="hr"><div class="dot"></div><span class="mono" id="clk"></span></div>
</header>

<div id="fs" class="fs">
  <div class="bc">Dashboard — <span class="mono" id="fc"></span></div>
  <div class="flist" id="fr"></div>
</div>

<div id="ds" class="dv">
  <div class="bc"><a onclick="goFleet()">Dashboard</a><span style="margin:0 2px">›</span><span id="dcr"></span></div>
  <div class="detail-top">
    <div class="detail-left">
      <div class="dt" id="dtt"></div>
      <div class="ds" id="dsu"></div>
    </div>
    <button class="back-btn" onclick="goFleet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to Dashboard
    </button>
  </div>
  <div class="summary-row" id="dsr"></div>
  <div class="cb">
    <h3>Live Temperature</h3>
    <div class="cw"><canvas id="dc"></canvas></div>
  </div>
  <div style="font-size:13px;font-weight:600;margin-bottom:10px">Sensor Readings</div>
  <div class="sensor-detail-grid" id="dsg"></div>
  <div class="unit-nav" id="unit-nav"></div>
</div>

<footer>AUSTIN BURRIS &nbsp;✕&nbsp; THERMALGUARD ENGINEERING &nbsp;✕&nbsp; POSITRONIC</footer>

<script>
const TH=30,TK=1500,MH=60;
const U=[{id:'BU-001',n:'Backshell Unit 1',l:'Rack A-12',r:0},{id:'BU-002',n:'Backshell Unit 2',l:'Rack A-14',r:0},{id:'BU-003',n:'Backshell Unit 3',l:'Rack B-07',r:1},{id:'BU-004',n:'Backshell Unit 4',l:'Rack C-03',r:0},{id:'BU-005',n:'Backshell Unit 5',l:'Rack D-19',r:0}];
const D={};
U.forEach(u=>{const a=22+Math.random()*3;D[u.id]={a,s:[{b:a+12+Math.random()*6},{b:a+10+Math.random()*8},{b:a+11+Math.random()*7}],h:{l:[],t1:[],t2:[],t3:[],am:[]},t:0}});

function sm(u,i){const d=D[u.id],v=d.s[i].b+Math.sin(d.t*.04+i)*1.5+(Math.random()-.5)*.8;if(!u.r||d.t<=20)return v;const r=Math.min((d.t-20)*.6,18);return v+[1,.7,.5][i]*r}
function sa(u){const d=D[u.id];return d.a+Math.sin(d.t*.02)*.5+(Math.random()-.5)*.3}

function tick(){U.forEach(u=>{const d=D[u.id];d.t++;const a=sa(u),t=[sm(u,0),sm(u,1),sm(u,2)];d.ca=a;d.ct=t;d.dl=t.map(v=>v-a);d.ad=d.dl.reduce((a,b)=>a+b,0)/3;d.al=d.dl.some(v=>v>=TH);
const h=d.h,now=new Date().toLocaleTimeString();h.l.push(now);h.t1.push(t[0]);h.t2.push(t[1]);h.t3.push(t[2]);h.am.push(a);
if(h.l.length>MH){h.l.shift();h.t1.shift();h.t2.shift();h.t3.shift();h.am.shift()}})}

setInterval(()=>{document.getElementById('clk').textContent=new Date().toLocaleTimeString()},1000);

function rFleet(){
  let ok=0,al=0,h='';
  U.forEach(u=>{
    const d=D[u.id];d.al?al++:ok++;
    const pk=Math.max(...d.dl);
    h+=`<div class="unit-row" onclick="goDetail('${u.id}')">
      <div class="unit-info"><div class="un">${u.n}</div><div class="ul">${u.id} · ${u.l}</div></div>
      <div class="unit-deltas">
        <div class="delta-group"><div class="dg-label">Avg ΔT</div><div class="dg-val mono" style="color:${d.ad>=TH?'var(--alert)':'var(--accent)'}">${d.ad.toFixed(1)}°</div></div>
        <div class="delta-group"><div class="dg-label">Peak ΔT</div><div class="dg-val mono" style="color:${pk>=TH?'var(--alert)':'var(--text)'}">${pk.toFixed(1)}°</div></div>
      </div>
      <div class="sensor-pills">
        ${d.dl.map((v,i)=>`<span class="pill mono" style="color:${v>=TH?'var(--alert)':['var(--s1)','var(--s2)','var(--s3)'][i]}">S${i+1} ${v.toFixed(1)}°</span>`).join('')}
      </div>
      <span class="badge ${d.al?'b-al':'b-ok'}">${d.al?'ALERT':'OK'}</span>
    </div>`;
  });
  document.getElementById('fr').innerHTML=h;
  document.getElementById('fc').textContent=`${ok} OK · ${al} Alert`;
}

let ch=null,cu=null;
function goDetail(id){cu=id;document.getElementById('fs').classList.add('hid');document.getElementById('ds').classList.add('act');rDetail()}
function goFleet(){cu=null;document.getElementById('fs').classList.remove('hid');document.getElementById('ds').classList.remove('act');if(ch){ch.destroy();ch=null}}

function rDetail(){
  if(!cu)return;
  const u=U.find(x=>x.id===cu),d=D[cu],pk=Math.max(...d.dl);
  document.getElementById('dcr').textContent=u.n;
  document.getElementById('dtt').textContent=u.n;
  document.getElementById('dsu').innerHTML=`${u.id} · ${u.l} &nbsp;<span class="badge ${d.al?'b-al':'b-ok'}">${d.al?'ALERT':'OK'}</span>`;

  document.getElementById('dsr').innerHTML=`
    <div class="sc"><div class="sl">Avg Delta</div><div class="sv mono" style="color:${d.ad>=TH?'var(--alert)':'var(--accent)'}">${d.ad.toFixed(1)}°C</div></div>
    <div class="sc"><div class="sl">Peak Delta</div><div class="sv mono" style="color:${pk>=TH?'var(--alert)':'var(--text)'}">${pk.toFixed(1)}°C</div></div>
    <div class="sc"><div class="sl">Threshold</div><div class="sv mono" style="color:var(--dim)">${TH}°C</div></div>`;

  const nm=['Monitor 1','Monitor 2','Monitor 3'],cl=['c1','c2','c3'],co=['var(--s1)','var(--s2)','var(--s3)'];
  let sg='';
  for(let i=0;i<3;i++){
    const delta=d.dl[i],isAl=delta>=TH;
    sg+=`<div class="sd-card ${cl[i]}">
      <div class="sd-label">${nm[i]}</div>
      <div class="sd-temp mono" style="color:${co[i]}">${d.ct[i].toFixed(1)}°C</div>
      <div class="sd-delta ${isAl?'al':'ok'} mono">Δ ${delta.toFixed(1)}°C</div>
    </div>`;
  }
  sg+=`<div class="sd-card ca">
    <div class="sd-label">Ambient</div>
    <div class="sd-temp mono" style="color:var(--amb)">${d.ca.toFixed(1)}°C</div>
    <div class="sd-delta ref mono">Reference</div>
  </div>`;
  document.getElementById('dsg').innerHTML=sg;

  // Chart - raw temps
  const hs=d.h,cx=document.getElementById('dc');
  if(ch){
    ch.data.labels=hs.l;
    ch.data.datasets[0].data=hs.t1;
    ch.data.datasets[1].data=hs.t2;
    ch.data.datasets[2].data=hs.t3;
    ch.data.datasets[3].data=hs.am;
    ch.update('none');
  } else {
    ch=new Chart(cx,{type:'line',data:{labels:hs.l,datasets:[
      {label:'Monitor 1',data:hs.t1,borderColor:'#00d4aa',borderWidth:2,pointRadius:0,tension:.3,fill:false},
      {label:'Monitor 2',data:hs.t2,borderColor:'#4da6ff',borderWidth:2,pointRadius:0,tension:.3,fill:false},
      {label:'Monitor 3',data:hs.t3,borderColor:'#a07cff',borderWidth:2,pointRadius:0,tension:.3,fill:false},
      {label:'Ambient',data:hs.am,borderColor:'#ffa842',borderWidth:2,borderDash:[6,3],pointRadius:0,tension:.3,fill:false},
    ]},options:{responsive:true,maintainAspectRatio:false,animation:false,
      scales:{
        x:{ticks:{color:'#7a8a9e',font:{size:10},maxTicksLimit:8},grid:{color:'rgba(35,46,59,.5)'}},
        y:{ticks:{color:'#7a8a9e',font:{size:10},callback:v=>v.toFixed(0)+'°C'},grid:{color:'rgba(35,46,59,.5)'}}
      },
      plugins:{
        legend:{labels:{color:'#7a8a9e',usePointStyle:true,pointStyle:'circle',padding:16,font:{size:11}}},
        tooltip:{backgroundColor:'#1a222c',titleColor:'#e4e8ed',bodyColor:'#e4e8ed',borderColor:'#232e3b',borderWidth:1,callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.parsed.y.toFixed(1)+'°C'}}
      }
    }});
  }

  // Unit navigation
  const ci=U.findIndex(x=>x.id===cu);
  const prev=ci>0?U[ci-1]:null;
  const next=ci<U.length-1?U[ci+1]:null;
  document.getElementById('unit-nav').innerHTML=`
    ${prev?`<button class="nav-btn" onclick="switchUnit('${prev.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg><div><div class="nav-label">Previous</div>${prev.n}</div></button>`:'<div></div>'}
    ${next?`<button class="nav-btn" onclick="switchUnit('${next.id}')"><div><div class="nav-label">Next</div>${next.n}</div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></button>`:'<div></div>'}
  `;
}

function switchUnit(id){if(ch){ch.destroy();ch=null;}cu=id;rDetail()}

for(let i=0;i<5;i++)tick();rFleet();
setInterval(()=>{tick();cu?rDetail():rFleet()},TK);
</script>
